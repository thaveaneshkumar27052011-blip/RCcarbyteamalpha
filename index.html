<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Smart Surveillance Rover</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h2 { color: #00bcd4; margin-top: 0; }
    
    .ip-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #00ffcc;
      font-size: 14px;
      text-align: center;
      box-sizing: border-box;
    }

    .stream-box {
      width: 100%;
      height: 220px;
      background-color: #000;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
    }
    .stream-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .section-title {
      font-weight: bold;
      margin: 15px 0 10px 0;
      font-size: 13px;
      letter-spacing: 1px;
      color: #aaa;
      text-transform: uppercase;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      background-color: #2c3e50;
      transition: background 0.1s, transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-blue { background-color: #007bff; }
    .btn-red { background-color: #dc3545; grid-column: span 3; }
    .btn-green { background-color: #28a745; }
    .btn-orange { background-color: #fd7e14; }
    .btn-purple { background-color: #6f42c1; }
  </style>
</head>
<body>

<div class="container">
  <h2>ESP32 Rover Control</h2>

  <!-- Rover Target IP Address -->
  <input type="text" id="roverIp" class="ip-box" value="http://192.168.4.1" placeholder="Rover IP (e.g., http://192.168.4.1)">

  <!-- Video Stream Box -->
  <div class="stream-box">
    <img id="videoFeed" src="" alt="Live Video Feed Standby" onerror="this.style.display='none'; document.getElementById('feedText').style.display='block';">
    <span id="feedText" style="color: #666;">Camera Stream Offline</span>
  </div>

  <!-- Movement Controls -->
  <div class="section-title">Movement Control</div>
  <div class="grid-3">
    <div></div>
    <button class="btn btn-blue" onclick="sendCmd('/forward')">▲ Forward</button>
    <div></div>
    <button class="btn btn-blue" onclick="sendCmd('/left')">◄ Left</button>
    <div></div>
    <button class="btn btn-blue" onclick="sendCmd('/right')">Right ►</button>
    <div></div>
    <button class="btn btn-blue" onclick="sendCmd('/back')">▼ Back</button>
    <div></div>
    <button class="btn btn-red" onclick="sendCmd('/stop')">STOP</button>
  </div>

  <!-- Mode Control -->
  <div class="section-title">Mode Selection</div>
  <div style="display: flex; gap: 10px; margin-bottom: 10px;">
    <button class="btn btn-green" style="flex: 1;" onclick="sendCmd('/auto')">Auto Mode</button>
    <button class="btn btn-orange" style="flex: 1;" onclick="sendCmd('/manual')">Manual Mode</button>
  </div>

  <!-- Camera Pan / Tilt Controls -->
  <div class="section-title">Camera Control</div>
  <div class="grid-3">
    <div></div>
    <button class="btn btn-purple" onclick="sendCmd('/tiltUp')">Tilt Up</button>
    <div></div>
    <button class="btn btn-purple" onclick="sendCmd('/panLeft')">Pan Left</button>
    <div></div>
    <button class="btn btn-purple" onclick="sendCmd('/panRight')">Pan Right</button>
    <div></div>
    <button class="btn btn-purple" onclick="sendCmd('/tiltDown')">Tilt Down</button>
    <div></div>
  </div>
</div>

<script>
  function sendCmd(path) {
    let baseUrl = document.getElementById('roverIp').value.trim();
    if (!baseUrl.startsWith('http://') && !baseUrl.startsWith('https://')) {
      baseUrl = 'http://' + baseUrl;
    }
    
    // Sends command quietly to the ESP32
    fetch(baseUrl + path, { mode: 'no-cors' })
      .catch(err => console.log('Sent request to ' + path));
  }

  // Optional: Set stream IP for camera feed
  function setCameraStream(cameraIp) {
    const img = document.getElementById('videoFeed');
    document.getElementById('feedText').style.display = 'none';
    img.style.display = 'block';
    img.src = cameraIp + ':81/stream'; // Default ESP32-CAM stream port
  }
</script>

</body>
</html>
